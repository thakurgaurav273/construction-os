version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sitepilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sitepilot
      POSTGRES_PASSWORD: sitepilot
      POSTGRES_DB: sitepilot
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sitepilot']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sitepilot-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: sitepilot-backend
    restart: unless-stopped
    ports:
      - '5174:5174'
    environment:
      - DATABASE_URL=postgresql://sitepilot:sitepilot@postgres:5432/sitepilot?schema=public
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:5173
      - PORT=5174
      - COOKIE_SECRET=dokploy_secret_cookie_key
      - JWT_SECRET=dokploy_secret_jwt_key
      - DEMO_MODE=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: sitepilot-frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5174/api
      - PORT=5173
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
